<svg xmlns="http://www.w3.org/2000/svg" viewBox="-83 -738 766 766">
  <!-- Favicon: an "8" in the site's muted blue (#6A8BAF, the panel-muted token), traced from
       Geist Mono SemiBold (the site font) as a vector path, since favicons can't load web fonts.
       (No double hyphens anywhere in this comment: XML forbids them inside comments, and an
       invalid file shows no icon at all.) Transparent, no tile.
       The path is in font units (y up), so scale(1 -1) flips it. The glyph spans x 42–558,
       y −16–726 (742 tall); the square viewBox is 742 + 12 + 12 = 766 units, centred on the
       glyph (x 300, y 355), so the 8 fills the full height with ~1.6% padding top and bottom.
       public/favicon.ico (16, 32) and apple-touch-icon.png are rendered from the same path. -->
